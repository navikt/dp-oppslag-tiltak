name: Test PRs

on:
  push:
    branches:
      - 'dependabot/**'
      - 'renovate/**'

jobs:
  # Denne matches mot required checks som trigger automerge av Dependabot PRs. Endrer du her må du også endre i https://github.com/navikt/dp-*/settings/branches
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 26.0.2+10

      - uses: gradle/gradle-build-action@v3.5.0
        with:
          arguments: --configuration-cache test

      # Alternativ for repos med node
      #- uses: actions/setup-node@v4
      #  with:
      #    node-version-file: package.json
      #    cache: npm
      #- run: npm install
      #- run: npm test